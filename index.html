<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DAMICK</title>
<meta name="theme-color" content="#1a1410" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name" id="easter-egg">DAMICK</span>
    </div>
    <div class="topbar-actions">
      <input type="file" id="pdn-file-input" accept=".pdn,.txt" multiple hidden />
      <button id="btn-import" class="action-btn" title="Importer un fichier PDN">📂 Importer</button>
      <button id="btn-paste" class="icon-btn" title="Coller une partie (presse-papier)">📋</button>
      <button id="btn-copy" class="icon-btn" title="Copier la partie (presse-papier)">⧉</button>
      <div class="dropdown" id="export-dropdown">
        <button id="btn-export" class="action-btn" title="Exporter">⭳ Exporter</button>
        <div class="dropdown-menu" id="export-menu" hidden>
          <button id="btn-export-pdn" class="dropdown-item">Format PDN</button>
          <button id="btn-export-txt" class="dropdown-item">Format TXT</button>
        </div>
      </div>
      <div class="dropdown" id="theme-dropdown">
        <button id="btn-theme" class="icon-btn" title="Thème du damier et des pions">🎨</button>
        <div class="dropdown-menu" id="theme-menu" hidden>
          <div class="dropdown-section-label">Damier</div>
          <div id="board-theme-options"></div>
          <div class="dropdown-section-label">Pions</div>
          <div id="piece-style-options"></div>
        </div>
      </div>
      <div class="topbar-sep"></div>
      <button id="btn-flip" class="icon-btn" title="Retourner le plateau (F)">⇅</button>
      <button id="btn-fullscreen" class="icon-btn" title="Plein écran">⛶</button>
    </div>
  </header>

  <main class="layout">
    <aside class="players-rail">
      <div class="game-meta-card" id="game-meta-bar">
        <span class="meta-chip meta-chip-event" data-field="Event" contenteditable="true" title="Événement">Partie libre</span>
        <div class="meta-chip-row">
          <span class="meta-chip" data-field="Site" contenteditable="true" title="Lieu">—</span>
          <span class="meta-sep">·</span>
          <span class="meta-chip" data-field="Date" contenteditable="true" title="Date">—</span>
          <span class="meta-sep">·</span>
          <span class="meta-chip" data-field="Round" contenteditable="true" title="Ronde">—</span>
        </div>
      </div>

      <div class="player-card" data-side="black">
        <div class="player-photo" data-side-avatar="black">N</div>
        <div class="player-card-body">
          <div class="player-name" data-field="Black" contenteditable="true" spellcheck="false">Joueur Noirs</div>
          <div class="player-card-meta">
            <span class="meta-field" data-field="BlackTitle" contenteditable="true" title="Titre">—</span>
            <span class="meta-field" data-field="BlackElo" contenteditable="true" title="Elo">Elo —</span>
          </div>
          <div class="player-card-stats">
            <div class="stat-block">
              <span class="stat-value" data-field="BlackScore" contenteditable="true" title="Score">—</span>
              <span class="stat-label">Score</span>
            </div>
            <div class="stat-block" id="count-black">
              <span class="count-value">20</span>
              <span class="count-label">Pions</span>
            </div>
          </div>
        </div>
      </div>

      <div class="players-rail-divider">
        <span class="tempo-delta" id="tempo-delta" title="Compteur de temps (théorie des finales)">0</span>
      </div>

      <div class="player-card" data-side="white">
        <div class="player-photo" data-side-avatar="white">B</div>
        <div class="player-card-body">
          <div class="player-name" data-field="White" contenteditable="true" spellcheck="false">Joueur Blancs</div>
          <div class="player-card-meta">
            <span class="meta-field" data-field="WhiteTitle" contenteditable="true" title="Titre">—</span>
            <span class="meta-field" data-field="WhiteElo" contenteditable="true" title="Elo">Elo —</span>
          </div>
          <div class="player-card-stats">
            <div class="stat-block">
              <span class="stat-value" data-field="WhiteScore" contenteditable="true" title="Score">—</span>
              <span class="stat-label">Score</span>
            </div>
            <div class="stat-block" id="count-white">
              <span class="count-value">20</span>
              <span class="count-label">Pions</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <section class="board-column">

      <div class="board-stage">
        <div class="board-wrap">
          <canvas id="board-canvas"></canvas>
        </div>
      </div>

      <div class="controls-bar">
        <button id="btn-first" class="ctrl-btn" title="Début (Origine)">⏮</button>
        <button id="btn-prev" class="ctrl-btn" title="Coup précédent (←)">◀</button>
        <button id="btn-play" class="ctrl-btn ctrl-btn-main" title="Lecture auto (Espace)">▶</button>
        <button id="btn-next" class="ctrl-btn" title="Coup suivant (→)">▶</button>
        <button id="btn-last" class="ctrl-btn" title="Fin">⏭</button>
        <div class="ctrl-sep"></div>
        <label class="ctrl-speed-label">
          Vitesse
          <input type="range" id="speed-slider" min="1" max="10" value="4" step="1" />
          <span id="speed-value">×1</span>
        </label>
        <div class="ctrl-sep"></div>
        <button id="btn-toggle-arrow" class="ctrl-btn" title="Afficher/masquer la flèche du dernier coup">➜</button>
      </div>

      <div class="status-line" id="status-line">Trait aux Blancs</div>
    </section>

    <aside class="side-panel">
      <div class="panel-tabs">
        <button class="panel-tab active" id="tab-moves" data-tab="moves">Coups joués</button>
        <button class="panel-tab" id="tab-library" data-tab="library">Bibliothèque <span id="library-count" class="tab-badge" hidden>0</span></button>
      </div>
      <div class="panel-body" id="panel-moves">
        <ol class="move-list" id="move-list"></ol>
        <textarea id="move-comment" class="move-comment" rows="3" placeholder="Aucun coup joué" disabled></textarea>
        <div class="panel-footer">
          <button id="btn-undo" class="text-btn">↺ Annuler</button>
          <button id="btn-redo" class="text-btn">↻ Rétablir</button>
        </div>
      </div>
      <div class="panel-body" id="panel-library" hidden>
        <ul class="library-list" id="library-list"></ul>
        <div class="library-empty" id="library-empty">Aucune partie importée pour l'instant.</div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" hidden></div>
  <div class="dropzone-overlay" id="dropzone-overlay" hidden>
    <div class="dropzone-message">Déposer le fichier PDN ici</div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
