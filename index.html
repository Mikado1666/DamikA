<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DAMICK</title>
<meta name="theme-color" content="#1a1410" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">DAMICK</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-flip" class="icon-btn" title="Retourner le plateau (F)">⇅</button>
      <button id="btn-fullscreen" class="icon-btn" title="Plein écran">⛶</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-column">

      <div class="player-banner" data-side="black">
        <div class="player-avatar" data-side-avatar="black">N</div>
        <div class="player-info">
          <div class="player-name" contenteditable="true" spellcheck="false">Joueur Noirs</div>
          <div class="player-meta">
            <span class="meta-field" contenteditable="true" title="Elo">Elo —</span>
            <span class="meta-field" contenteditable="true" title="Titre">—</span>
          </div>
        </div>
        <div class="player-count" id="count-black">
          <span class="count-value">20</span>
          <span class="count-label">pions</span>
        </div>
      </div>

      <div class="board-stage">
        <div class="board-wrap">
          <canvas id="board-canvas"></canvas>
        </div>
        <div class="tempo-panel" id="tempo-panel">
          <div class="tempo-title">Compteur de temps</div>
          <div class="tempo-value" id="tempo-value">0</div>
          <div class="tempo-bar">
            <div class="tempo-bar-fill" id="tempo-bar-fill"></div>
          </div>
          <div class="tempo-caption" id="tempo-caption">Blancs et Noirs à égalité</div>
        </div>
      </div>

      <div class="player-banner" data-side="white">
        <div class="player-avatar" data-side-avatar="white">B</div>
        <div class="player-info">
          <div class="player-name" contenteditable="true" spellcheck="false">Joueur Blancs</div>
          <div class="player-meta">
            <span class="meta-field" contenteditable="true" title="Elo">Elo —</span>
            <span class="meta-field" contenteditable="true" title="Titre">—</span>
          </div>
        </div>
        <div class="player-count" id="count-white">
          <span class="count-value">20</span>
          <span class="count-label">pions</span>
        </div>
      </div>

      <div class="controls-bar">
        <button id="btn-first" class="ctrl-btn" title="Début (Origine)">⏮</button>
        <button id="btn-prev" class="ctrl-btn" title="Coup précédent (←)">◀</button>
        <button id="btn-play" class="ctrl-btn ctrl-btn-main" title="Lecture auto (Espace)">▶</button>
        <button id="btn-next" class="ctrl-btn" title="Coup suivant (→)">▶</button>
        <button id="btn-last" class="ctrl-btn" title="Fin">⏭</button>
        <div class="ctrl-sep"></div>
        <label class="ctrl-select-label">
          Vitesse
          <select id="speed-select" class="ctrl-select">
            <option value="600">Normale</option>
            <option value="260" selected>Rapide</option>
            <option value="90">Ultra-rapide</option>
            <option value="0">Instantanée</option>
          </select>
        </label>
      </div>

      <div class="status-line" id="status-line">Trait aux Blancs</div>
    </section>

    <aside class="side-panel">
      <div class="panel-header">Coups joués</div>
      <ol class="move-list" id="move-list"></ol>
      <div class="panel-footer">
        <button id="btn-undo" class="text-btn">↺ Annuler</button>
        <button id="btn-redo" class="text-btn">↻ Rétablir</button>
      </div>
    </aside>
  </main>

  <footer class="footer-note">DAMICK — jeu de dames internationales 10×10 · <span id="easter-egg">FMJD</span></footer>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
